name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Chọn Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)
          echo "Dùng $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Cài XcodeGen
        run: brew install xcodegen

      - name: Sinh project
        run: xcodegen generate

      - name: Unit test (simulator)
        run: |
          set -o pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          runtimes = sorted((k for k in data if "iOS" in k), key=lambda k: [int(x) for x in k.split("iOS-")[-1].split("-")])
          for rt in reversed(runtimes):
              for d in data[rt]:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit(0)
          ')
          echo "Simulator: $DEVICE_ID"
          xcodebuild test \
            -project Baoboiii.xcodeproj \
            -scheme Baoboiii \
            -destination "id=$DEVICE_ID" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | tee test.log | grep -E "error:|warning: .*Baoboiii|Test Case|Executed|\*\* TEST" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" test.log

      - name: Build Release (chưa ký)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Baoboiii.xcodeproj \
            -scheme Baoboiii \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee build.log | grep -E "error:|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" build.log

      - name: Đóng gói .ipa
        run: |
          rm -rf Payload
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Baoboiii.app Payload/
          zip -qry baoboiii.ipa Payload
          ls -lh baoboiii.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: baoboiii-ipa
          path: baoboiii.ipa

      - name: Cập nhật bản phát hành "latest"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest baoboiii.ipa \
            --title "baoboiii (bản mới nhất)" \
            --notes "Bản build tự động từ commit ${GITHUB_SHA::7}. Tải file baoboiii.ipa rồi cài bằng Sideloadly." \
            --target "$GITHUB_SHA"

      - name: Upload log khi lỗi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            test.log
            build.log
